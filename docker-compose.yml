# One command local run:  docker compose up --build
#   App:       http://localhost:8080
#   API docs:  http://localhost:8080/api/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coworking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coworking"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/coworking
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-docker-secret-change-me}
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:8080
      BUSINESS_TIMEZONE: Asia/Kolkata
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
